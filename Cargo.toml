[workspace.package]
version     = "3.0.0-alpha.0"
description = "Diff & Merge hkx patcher"

authors      = ["SARDONYX-sard"]
categories   = ["games", "parsing"]
edition      = "2024"
keywords     = ["skyrim"]
license      = "GPL-3.0-or-later"
readme       = "README.md"
repository   = "https://github.com/SARDONYX-sard/d-merge"
rust-version = "1.95"


[workspace]
members         = ["crates/core/*", "crates/gui/*", "xtask"]
resolver        = "3"
default-members = ["crates/gui/d_merge"]


[workspace.dependencies]
bitflags            = "2.13.2"
bitvec              = "1.0.1"
chrono              = "0.4.44"
crc                 = "3.4.0"
dark-light          = "3.0.0"
dashmap             = "6.2.1"
educe               = "0.8.1"
eframe              = { version = "0.37.0", default-features = false }
egui                = "0.37.0" # GUI widgets (shared by the gui crates; eframe stays in the app crate)
egui_dnd            = "0.18.0"
egui_extras         = "0.37.0"
egui_flex           = "0.9.0"
egui_router         = "0.10.0"
font-kit            = "0.14.3"
futures             = "0.3.34"
ico                 = "0.6.0"
image               = "0.25.10"
imara-diff          = "0.2.0"
indexmap            = { version = "2.14.2", features = ["rayon"] }
jwalk               = "0.9.0"
mimalloc            = "0.1.52"
once_cell           = "1.21.4"
open                = "5.4.4"
parking_lot         = "0.13.0"
phf                 = "0.14.0"
quote               = "1.0.45"
rapidhash           = "4.5.1"
rayon               = "1.12.0"
regex               = { version = "1.11.1", default-features = false, features = ["std", "perf", "unicode"] } # search of the editors
rfd                 = { version = "0.17.2", default-features = false }
rfd-linux           = { package = "rfd", version = "0.15.4", features = ["xdg-portal"] } # gui_shared re-exports it as `rfd` on Linux
rmp-serde           = "1.3.1" # message pack binary serde
semver              = "1.0.28"
serde               = { version = "1.0.229", features = ["derive"] } # Implement (De)Serialize
serde_ini           = "0.2.0"
serde_json          = "1.0.154" # gui: To avoid generate_context error.
serde_path_to_error = "0.1.20"
serde_repr          = "0.1.21" # C like Serialize enum into numbers.(Using progress reporting)
simd-json           = "0.19.0"
snafu               = "0.9.2"
sonic-rs            = "0.5.10"
syn                 = "3.0.9"
sysinfo             = "0.40.1"
temp-dir            = "0.2.0"
tokio               = { version = "1.54.1", features = ["fs", "rt-multi-thread"] } # Async runtime
tracing             = { version = "0.1.44" } # logger
tracing-subscriber  = "0.3.23"
urlencoding         = "2.1.3"
wgpu                = "30.0.1"
winnow              = { version = "1.0.5", features = ["simd"] }
winres              = "0.1.12"

auto_charset    = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx", rev = "e71c602", default-features = false }
class_generator = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx", rev = "e71c602" } # xtask only: class json files
diff            = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx", rev = "e71c602", default-features = false }
havok_classes = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx", rev = "e71c602", default-features = false, features = [
  "ignore_duplicates",
] }
havok_types        = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx", rev = "e71c602", default-features = false }
serde_hkx          = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx", rev = "e71c602", default-features = false }
serde_hkx_features = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx", rev = "e71c602", default-features = false }
winnow_ext         = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx", rev = "e71c602", default-features = false }

# dev-dependencies
pretty_assertions = "1.4.1" # Color diff assertion
quick_tracing     = { version = "0.1.5", features = ["derive"] } # Easy logging

# workspace members
behavior_merge       = { path = "./crates/core/behavior_merge" }
behavior_merge_types = { path = "./crates/core/behavior_merge_types" }
fast_hash            = { path = "./crates/core/fast_hash" }
fnis_list            = { path = "./crates/core/fnis_list" }
fnis_patch_gen       = { path = "./crates/core/fnis_patch_gen" }
hkx_io               = { path = "./crates/core/hkx_io" }
json_patch           = { path = "./crates/core/json_patch" }
jwalk_glob           = { path = "./crates/core/jwalk_glob" }
nemesis_diff         = { path = "./crates/core/nemesis_diff" }
nemesis_patch_syntax = { path = "./crates/core/nemesis_patch_syntax" }
nemesis_xml          = { path = "./crates/core/nemesis_xml" }
pandora_patch        = { path = "./crates/core/pandora_patch" }
skyrim_anim_data     = { path = "./crates/core/skyrim_anim_data" }
skyrim_crc           = { path = "./crates/core/skyrim_crc" }
skyrim_esp           = { path = "./crates/core/skyrim_esp" }
stdx                 = { path = "./crates/core/stdx" }

egui_code_editor  = { path = "./crates/gui/egui_code_editor" }
egui_widgets      = { path = "./crates/gui/egui_widgets" }
gh_issue_link     = { path = "./crates/gui/gh_issue_link" }
gui_shared        = { path = "./crates/gui/gui_shared" }
hkanno_lsp        = { path = "./crates/gui/hkanno_lsp" }
mod_info          = { path = "./crates/gui/mod_info" }
node_expr         = { path = "./crates/gui/node_expr" }
page_convert      = { path = "./crates/gui/page_convert" }
page_hkanno       = { path = "./crates/gui/page_hkanno" }
page_patch        = { path = "./crates/gui/page_patch" }
page_patch_editor = { path = "./crates/gui/page_patch_editor" }
serde_hkx_for_gui = { path = "./crates/gui/serde_hkx_for_gui" }
skyrim_data_dir   = { path = "./crates/gui/skyrim_data_dir" }
tracing_rotation  = { path = "./crates/gui/tracing_rotation" }


# NOTE: Set this to lto because there is a part of CI that assumes release dir, and use lto only when the tag is typed.
[profile.release]
# NOTE: Optimizing to the limit reduces the size of the binary, but for some reason,
# the second async fn cannot be executed, resulting in an error, so it is turned off.
codegen-units = 1
debug         = false
lto           = true
opt-level     = 3
# panic = 'abort'
strip = true

# Use release mode during development to prevent `serde-hkx` stack overflow
# - ref: https://doc.rust-lang.org/cargo/reference/profiles.html#release
[profile.release-no-lto]
inherits         = "dev"
opt-level        = 3
debug            = false
strip            = "none"
debug-assertions = false
overflow-checks  = false
lto              = false
panic            = 'unwind'
incremental      = false
codegen-units    = 16
rpath            = false


[workspace.lints.rust]
bad_style                     = "deny"
dead_code                     = "deny"
future_incompatible           = "deny"
improper_ctypes               = "deny"
keyword_idents                = "deny"
missing_debug_implementations = "deny"
# missing_docs = "deny"
non_ascii_idents             = "deny"
non_shorthand_field_patterns = "deny"
nonstandard_style            = "deny"
noop_method_call             = "deny"
overflowing_literals         = "deny"
path_statements              = "deny"
patterns_in_fns_without_body = "deny"
renamed_and_removed_lints    = "deny"
trivial_casts                = "deny"
trivial_numeric_casts        = "deny"
unconditional_recursion      = "deny"
unreachable_pub              = "deny"
unused                       = "deny"
unused_allocation            = "deny"
unused_comparisons           = "deny"
unused_crate_dependencies    = "deny"
unused_extern_crates         = "deny"
unused_import_braces         = "deny"
unused_parens                = "deny"
# unused_results = "deny"
while_true = "deny"


[workspace.lints.clippy]
all     = { level = "warn", priority = -1 }
cargo   = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# allow list
derive_partial_eq_without_eq = "allow"
future_not_send              = "allow"
multiple_crate_versions      = "allow"
option_if_let_else           = "allow"
pub_with_shorthand           = "allow"
redundant_pub_crate          = "allow"
result_large_err             = "allow"

# custom deny list
char_lit_as_u8                     = "deny"
checked_conversions                = "deny"
clone_on_ref_ptr                   = "deny"
cognitive_complexity               = "deny"
debug_assert_with_mut_call         = "deny"
disallowed_script_idents           = "deny"
doc_link_with_quotes               = "deny"
empty_enums                        = "deny"
empty_line_after_outer_attr        = "deny"
empty_structs_with_brackets        = "deny"
expect_used                        = "deny"
expl_impl_clone_on_copy            = "deny"
explicit_deref_methods             = "deny"
explicit_into_iter_loop            = "deny"
fallible_impl_from                 = "deny"
filetype_is_file                   = "deny"
filter_map_next                    = "deny"
flat_map_option                    = "deny"
float_cmp                          = "deny"
float_cmp_const                    = "deny"
float_equality_without_abs         = "deny"
fn_params_excessive_bools          = "deny"
fn_to_numeric_cast_any             = "deny"
if_let_mutex                       = "deny"
implicit_clone                     = "deny"
imprecise_flops                    = "deny"
inefficient_to_string              = "deny"
invalid_upcast_comparisons         = "deny"
items_after_test_module            = "deny"
large_digit_groups                 = "deny"
large_stack_arrays                 = "deny"
large_types_passed_by_value        = "deny"
let_unit_value                     = "deny"
linkedlist                         = "deny"
lossy_float_literal                = "deny"
macro_use_imports                  = "deny"
manual_ok_or                       = "deny"
map_flatten                        = "deny"
map_unwrap_or                      = "deny"
match_same_arms                    = "deny"
match_wild_err_arm                 = "deny"
match_wildcard_for_single_variants = "deny"
mem_forget                         = "deny"
missing_const_for_fn               = "deny"
missing_enforced_import_renames    = "deny"
missing_errors_doc                 = "deny"
missing_panics_doc                 = "deny"
mut_mut                            = "deny"
mutex_integer                      = "deny"
needless_borrow                    = "deny"
needless_continue                  = "deny"
needless_for_each                  = "deny"
option_option                      = "deny"
path_buf_push_overwrite            = "deny"
ptr_as_ptr                         = "deny"
rc_mutex                           = "deny"
ref_option_ref                     = "deny"
rest_pat_in_fully_bound_structs    = "deny"
same_functions_in_if_condition     = "deny"
semicolon_if_nothing_returned      = "deny"
single_match_else                  = "deny"
string_add                         = "deny"
string_add_assign                  = "deny"
string_lit_as_bytes                = "deny"
suspicious_operation_groupings     = "deny"
trait_duplication_in_bounds        = "deny"
unnested_or_patterns               = "deny"
unseparated_literal_suffix         = "deny"
unused_self                        = "deny"
unwrap_in_result                   = "deny"
unwrap_used                        = "deny"
useless_let_if_seq                 = "deny"
useless_transmute                  = "deny"
verbose_file_reads                 = "deny"
wildcard_dependencies              = "deny"

