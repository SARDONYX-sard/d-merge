[package]
name = "fast_hash"
version = "0.1.0"
description = "Workspace-wide hash collection aliases. Change the hasher here only."

authors.workspace = true
categories = ["data-structures"]
edition.workspace = true
keywords = ["hash"]
license = "MIT OR Apache-2.0"
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
dashmap = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
rapidhash = { workspace = true }

[features]
default = []
# Enable `DashMap`/`DashSet` aliases.
dashmap = ["dep:dashmap"]
# Enable `IndexMap`/`IndexSet` aliases.
indexmap = ["dep:indexmap"]

[lints]
workspace = true
