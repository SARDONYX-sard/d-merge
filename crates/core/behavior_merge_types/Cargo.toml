[package]
name = "behavior_merge_types"
version = "0.1.0"
description = "D merge core: data exchanged between behavior_merge and fnis_patch_gen (config, template keys, patches)"

authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
keywords = ["skyrim"]
license = "GPL-3.0-or-later"
readme = "../../../README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
dashmap = { workspace = true, features = ["rayon", "serde"] }
fast_hash = { workspace = true }
phf = { workspace = true, features = ["macros"] }
rayon = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true, optional = true }

# workspace members
json_patch = { workspace = true, features = ["serde"] }
nemesis_xml = { workspace = true }
skyrim_anim_data = { workspace = true, features = ["alt_map", "serde"] }

[lints]
workspace = true

[features]
default = ["tracing"]
tracing = ["dep:tracing"]

# See `behavior_merge`'s `ts_serde` feature.
ts_serde = []
