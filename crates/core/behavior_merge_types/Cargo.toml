[package]
name        = "behavior_merge_types"
version     = "0.0.0"
description = "D merge core: data exchanged between behavior_merge and fnis_patch_gen (config, template keys, patches)"

authors.workspace      = true
categories             = ["development-tools"]
edition.workspace      = true
keywords               = ["skyrim"]
license                = "GPL-3.0-or-later"
readme                 = "../../../README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
fast_hash = { workspace = true }
hashbrown = { workspace = true } # `PriorityMap`
phf       = { workspace = true, features = ["macros"] }
rayon     = { workspace = true }
serde     = { workspace = true }

# workspace members
json_patch       = { workspace = true, features = ["serde"] }
nemesis_xml      = { workspace = true }
skyrim_anim_data = { workspace = true, features = ["alt_map", "serde"] }
stdx             = { workspace = true }

[dev-dependencies]
dashmap = { workspace = true } # the benchmarks compare against what the maps replaced

[lints]
workspace = true

[features]
default = ["tracing"]
# Nothing logs here now; kept as `behavior_merge`'s `tracing` turns it on.
tracing = []

# See `behavior_merge`'s `ts_serde` feature.
ts_serde = []
