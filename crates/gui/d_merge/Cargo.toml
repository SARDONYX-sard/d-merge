[package]
name = "d_merge"
# The app's version: this crate reads it with `env!("CARGO_PKG_VERSION")`.
# Other crates stay at 0.0.0, so that a version bump does not rebuild them.
version.workspace = true
description       = "Diff & Merge hkx patcher"

authors.workspace      = true
categories             = ["development-tools"]
edition.workspace      = true
keywords               = ["skyrim"]
license                = "GPL-3.0-or-later"
readme                 = "../../../README.md"
repository.workspace   = true
rust-version.workspace = true
build                  = "build.rs"


[build-dependencies]
winres = { workspace = true }


[dependencies]
# Fixed version. To avoid scroll crash bug
# NOTE: eframe 0.37 switched the default renderer to wgpu; keep glow as the default (wgpu is opt-in via `wgpu` feature).
# OS-specific features are added in the `[target.'cfg(..)'.dependencies]` sections below.
eframe = { workspace = true, features = [
  "accesskit",
  "clipboard",
  "default_fonts",
  "glow",
  "links",
] }
egui        = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_flex   = { workspace = true }
egui_router = { workspace = true }
image       = { workspace = true, features = ["jpeg", "png"] }
# ---

dashmap     = { workspace = true }
dark-light  = { workspace = true }
font-kit    = { workspace = true }
mimalloc    = { workspace = true, optional = true }
parking_lot = { workspace = true }
snafu       = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }

# workspace members
egui_widgets      = { workspace = true }
page_convert      = { workspace = true }
page_patch_editor = { workspace = true }
page_hkanno       = { workspace = true }
page_patch        = { workspace = true }
tracing_rotation  = { workspace = true }
gui_shared        = { path = "../gui_shared", features = ["tracing"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
wgpu = { workspace = true, features = [
  "fragile-send-sync-non-atomic-wasm",
], optional = true } # https://github.com/emilk/egui/issues/4885#issuecomment-2256316573


[features]
default = ["mimalloc"]

# The patch time was reduced by 4secs.
mimalloc = ["dep:mimalloc"]

# Use WebGPU
wgpu = ["eframe/wgpu", "dep:wgpu"]


[lints]
workspace = true
