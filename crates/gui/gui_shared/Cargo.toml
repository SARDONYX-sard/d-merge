[package]
name = "gui_shared"
version = "0.0.0"
description = "Diff & Merge hkx patcher gui shared code"

authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
keywords = ["skyrim"]
license = "MIT OR Apache-2.0"
readme = "../../../README.md"
repository.workspace = true
rust-version.workspace = true


[dependencies]
ico = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
open = { workspace = true }
parking_lot = { workspace = true }
fast_hash = { workspace = true }
rayon = { workspace = true }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true }
snafu = { workspace = true }
sonic-rs = { workspace = true }
tracing = { workspace = true, optional = true }

# workspace members
gh_issue_link = { workspace = true }
mod_info = { workspace = true }
skyrim_data_dir = { workspace = true, features = ["serde"] }
gui_shared_derive = { path = "../gui_shared_derive" }

# File dialogs. Differs per OS, so the page crates use it through `gui_shared::rfd`.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rfd-linux = { workspace = true }

[features]
tracing = ["dep:tracing"]


[lints]
workspace = true
