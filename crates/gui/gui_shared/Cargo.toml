[package]
name = "gui_shared"
version.workspace = true
description = "Diff & Merge hkx patcher gui shared code"

authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
keywords = ["skyrim"]
license = "GPL-3.0-or-later"
readme = "../../../README.md"
repository.workspace = true
rust-version.workspace = true


[dependencies]
ico = "0.5.0"
indexmap = { workspace = true, features = ["serde"] }
open = { version = "5.4.4" }
parking_lot = { workspace = true }
fast_hash = { workspace = true }
rayon = { workspace = true }
semver = { version = "1.0.28", features = ["serde"] }
serde = { workspace = true }
snafu = { workspace = true }
sonic-rs = { workspace = true }
tracing = { workspace = true, optional = true }

# workspace members
gh_issue_link = { workspace = true }
mod_info = { workspace = true }
skyrim_data_dir = { workspace = true, features = ["serde"] }
gui_shared_derive = { path = "../gui_shared_derive" }


[features]
tracing = ["dep:tracing"]


[lints]
workspace = true
