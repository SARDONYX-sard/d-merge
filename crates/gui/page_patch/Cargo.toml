[package]
name        = "page_patch"
version     = "0.0.0"
description = "D Merge GUI: patch page (mod list, options, running the merge)"

authors.workspace      = true
categories             = ["gui"]
edition.workspace      = true
keywords               = ["skyrim", "egui"]
license                = "GPL-3.0-or-later"
readme                 = "../../../README.md"
repository.workspace   = true
rust-version.workspace = true

[dependencies]
stdx        = { workspace = true }
egui        = { workspace = true }
egui_dnd    = { workspace = true }
egui_extras = { workspace = true }
parking_lot = { workspace = true }
rayon       = { workspace = true }
simd-json   = { workspace = true } # the values of `PatchJson`
sonic-rs    = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }

# workspace members
fast_hash            = { workspace = true }
behavior_merge       = { workspace = true, features = ["tracing"] }
behavior_merge_types = { workspace = true } # `PatchJson`: what the conflict check reads
json_patch           = { workspace = true, features = ["serde"] }
nemesis_diff         = { workspace = true }
nemesis_xml          = { workspace = true } # the user patch read again: see `Conflicts::read_user_patch`
egui_widgets         = { workspace = true }
gui_shared           = { workspace = true }
mod_info             = { workspace = true }
skyrim_data_dir      = { workspace = true, features = ["serde"] }
tracing_rotation     = { workspace = true }

[dev-dependencies]
skyrim_anim_data = { workspace = true, features = ["serde"] } # real patches of animation data in the tests

[lints]
workspace = true
