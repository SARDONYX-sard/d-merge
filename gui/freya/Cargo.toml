[package]
name = "d_merge_freya"
version.workspace = true
description = "Diff & Merge hkx patcher"

authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
keywords = ["skyrim"]
license = "GPL-3.0"
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
build = "build.rs"


[build-dependencies]
winres = "0.1.12"


[dependencies]
freya = { version = "0.5.0-rc.10", features = ["icons-lucide"] }
freya_extra = { git = "https://github.com/SARDONYX-sard/freya_extra", rev = "78d7e27" }

dark-light = "3.0.0"
font-kit = "0.14.3"
mimalloc = { version = "0.1.52", optional = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
snafu = { workspace = true }
sonic-rs = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

# workspace members
d_merge_gui_shared = { path = "../shared", features = ["tracing"] }
mod_info = { workspace = true }
nemesis_merge = { workspace = true, features = ["tracing"] }
skyrim_data_dir = { workspace = true, features = ["serde"] }
tracing_rotation = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15.4", features = ["xdg-portal"] }


[features]
default = ["mimalloc"]

# The patch time was reduced by 4secs.
mimalloc = ["dep:mimalloc"]


[lints]
workspace = true
